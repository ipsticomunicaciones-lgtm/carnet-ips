<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Fichas Médicas – IPS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { 
      --navy: #183453; 
      --red: #A82732; 
      --paper: #F3F5F4; 
      --yellow: #F7CF52; 
      --border: #B8C4C2;
    }
    * { box-sizing: border-box; }
    body { 
      font-family: 'DM Sans', sans-serif; 
      background: var(--paper); 
      color: var(--navy); 
      margin: 0; 
      padding: 16px; 
    }
    .form-container { 
      max-width: 650px; 
      margin: 20px auto; 
      background: #fff; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
    }
    h2 { text-align: center; color: var(--navy); margin-bottom: 25px; font-weight: 800; }
    h3 { color: var(--navy); border-bottom: 2px solid var(--yellow); padding-bottom: 6px; margin-top: 25px; font-size: 1.1rem; }
    label { display: block; margin-top: 14px; font-weight: 700; font-size: 14px; color: var(--navy); }
    input, textarea { 
      width: 100%; 
      padding: 12px; 
      margin-top: 6px; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      font: inherit; 
      background: #fff;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--navy); }
    
    .row-group { display: flex; gap: 12px; }
    .row-group > div { flex: 1; }

    .dynamic-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
    .btn-delete {
      background: #fff;
      color: var(--red);
      border: 1px solid var(--red);
      width: 44px;
      height: 44px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }
    .btn-delete:hover { background: #fdf2f2; }

    .btn-add {
      background: #fff;
      color: var(--navy);
      border: 2px solid var(--navy);
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
    }
    .btn-add:hover { background: #f0f4f8; }

    .char-counter-box {
      background: #eef2f5;
      padding: 12px 15px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #d4dfe6;
    }

    .btn-action { 
      background: var(--navy); 
      color: #fff; 
      border: none; 
      width: 100%; 
      padding: 15px; 
      margin-top: 20px; 
      font-weight: 800; 
      border-radius: 14px; 
      cursor: pointer; 
      font-size: 16px; 
    }
    .btn-action:hover { background: #10243d; }

    /* Estilos de la Tarjeta Final */
    #tarjetaFinal { 
      display: none; 
      max-width: 650px; 
      margin: 20px auto; 
      background: var(--paper); 
      border-radius: 20px; 
      overflow: hidden; 
      border: 1px solid #E3E8E7; 
    }
    .profile-header { 
      width: 100%; 
      background: var(--yellow); 
      padding: 35px 20px; 
      text-align: center; 
    }
    .portrait { 
      width: 116px; 
      height: 116px; 
      margin: 0 auto 20px; 
      border: 5px solid #fff; 
      border-radius: 50%; 
      object-fit: cover; 
      box-shadow: 0 5px 0 rgba(24,52,83,.11); 
      display: block; 
    }
    .profile-title { margin: 0; font-size: 2.2rem; font-weight: 800; color: var(--navy); line-height: 1.15; }
    .profile-subtitle { margin: 15px auto 0; max-width: 580px; font-size: 1.1rem; font-weight: 700; color: var(--red); line-height: 1.5; }
    .content-area { padding: 24px 16px; }
    .cards { display: grid; gap: 14px; }
    .info-card { 
      background: #fff; 
      border: 1px solid #E3E8E7; 
      border-radius: 20px; 
      padding: 22px; 
      box-shadow: 0 3px 13px rgba(24,52,83,.045); 
    }
    .card-heading { margin: 0 0 14px; font-weight: 800; font-size: 1.3rem; color: var(--navy); }
    .card-copy { margin: 0 0 8px; line-height: 1.55; font-size: 1.05rem; word-break: break-word; }
    .call-link { 
      display: flex; 
      width: 100%; 
      min-height: 56px; 
      align-items: center; 
      justify-content: center; 
      border-radius: 14px; 
      padding: 12px; 
      background: var(--red); 
      color: #fff; 
      font-weight: 800; 
      font-size: 1.1rem; 
      text-decoration: none; 
      box-shadow: 0 4px 0 #861A25; 
      margin-top: 12px; 
      text-align: center; 
    }
    .qr-section { 
      text-align: center; 
      background: #fff; 
      padding: 25px; 
      border-radius: 20px; 
      border: 1px solid #E3E8E7; 
    }
    .qr-box { margin: 15px auto; display: inline-block; padding: 10px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- 1. Formulario Principal -->
  <div class="form-container" id="panelFormulario">
    <h2>Generador de Fichas Médicas – IPS</h2>
    <form id="carnetForm">
      
      <h3>DATOS GENERALES</h3>
      <label>Nombre:</label>
      <input type="text" id="inputNombre" required placeholder="Ej. Elena Contreras Rivera">

      <label>Diagnóstico / Presentación:</label>
      <textarea id="inputDiagnostico" rows="2" placeholder="Ej. Tengo diagnóstico de autismo. Soy no hablante."></textarea>

      <label>Número(s) de contacto:</label>
      <div id="contenedorContactos">
        <div class="dynamic-row">
          <input type="tel" class="contactoTel" placeholder="Ej. 311 4828893">
        </div>
      </div>
      <button type="button" class="btn-add" onclick="agregarContacto()">+ Agregar número de contacto</button>


      <h3>ALERTA MÉDICA Y SEGURIDAD</h3>
      <div class="row-group">
        <div>
          <label>Tipo de sangre:</label>
          <input type="text" id="inputSangre" placeholder="Ej. A-">
        </div>
        <div>
          <label>Alergias:</label>
          <input type="text" id="inputAlergias" placeholder="Ej. Ninguna">
        </div>
      </div>

      <label>Comunicación:</label>
      <textarea id="inputComunicacion" rows="2" placeholder="Ej. SAAC, pictogramas y señalamientos."></textarea>


      <h3>QUE ME INCOMODA O SE ME DIFICULTA</h3>
      <div id="contenedorIncomoda">
        <div class="dynamic-row">
          <textarea class="inputIncomodaItem" rows="2" placeholder="Ej. Ruidos fuertes, cambios bruscos..."></textarea>
        </div>
      </div>
      <button type="button" class="btn-add" onclick="agregarIncomodidad()">+ Agregar incomodidad</button>


      <h3>COMO PUEDES AYUDARME</h3>
      <div id="contenedorAyuda">
        <div class="dynamic-row">
          <textarea class="inputAyudaItem" rows="2" placeholder="Ej. Háblame suave y con anticipación..."></textarea>
        </div>
      </div>
      <button type="button" class="btn-add" onclick="agregarAyuda()">+ Agregar indicador de ayuda</button>


      <h3>GUSTOS</h3>
      <div id="contenedorGustos">
        <div class="dynamic-row">
          <textarea class="inputGustosItem" rows="2" placeholder="Ej. Música clásica, animales, colores azules..."></textarea>
        </div>
      </div>
      <button type="button" class="btn-add" onclick="agregarGustos()">+ Agregar gusto</button>


      <h3>SUEÑO</h3>
      <textarea id="inputSueno" rows="3" placeholder="Escribe aquí las pautas de sueño y rutinas para acostarse..."></textarea>

      <label>Fotografía del Paciente:</label>
      <input type="file" id="inputFoto" accept="image/*" required>

      <!-- MEDIDOR DE CARACTERES -->
      <div class="char-counter-box">
        <span>Capacidad de texto usada:</span>
        <span id="textoPorcentaje">0 / 5,000 carac. (0%)</span>
      </div>

      <button type="button" class="btn-action" onclick="generarCarnetVisual()">Generar Ficha Interactiva</button>
    </form>
  </div>

  <!-- 2. Vista Final de la Tarjeta Interactiva -->
  <div id="tarjetaFinal">
    <header class="profile-header">
      <img id="viewFoto" class="portrait" alt="Foto del Paciente" src="">
      <h1 id="viewNombre" class="profile-title"></h1>
      <p id="viewSub" class="profile-subtitle"></p>
    </header>
    
    <main class="content-area">
      <div class="cards" id="contenedorCardsSalida">
        <!-- Se inyectan las secciones ordenadas de forma limpia -->
      </div>
    </main>
  </div>

  <script>
    // Contador dinámico de caracteres (hasta 5,000)
    document.getElementById('carnetForm').addEventListener('input', actualizarContador);

    function actualizarContador() {
      const form = document.getElementById('carnetForm');
      const elementos = form.querySelectorAll('input[type="text"], textarea');
      let totalCaracteres = 0;
      elementos.forEach(el => {
        if(el.type !== 'file' && el.type !== 'tel') {
          totalCaracteres += el.value.length;
        }
      });
      const maxLimiite = 5000;
      let porcentaje = (totalCaracteres / maxLimiite) * 100;
      if(porcentaje > 100) porcentaje = 100;
      
      document.getElementById('textoPorcentaje').innerText = totalCaracteres.toLocaleString() + " / " + maxLimiite.toLocaleString() + " carac. (" + porcentaje.toFixed(1) + "%)";
    }

    function agregarContacto() {
      const contenedor = document.getElementById('contenedorContactos');
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      div.innerHTML = `
        <input type="tel" class="contactoTel" placeholder="Número de contacto adicional">
        <button type="button" class="btn-delete" onclick="this.parentElement.remove(); actualizarContador();">✕</button>
      `;
      contenedor.appendChild(div);
      actualizarContador();
    }

    function agregarIncomodidad() {
      const contenedor = document.getElementById('contenedorIncomoda');
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      div.innerHTML = `
        <textarea class="inputIncomodaItem" rows="2" placeholder="Otra incomodidad o dificultad..."></textarea>
        <button type="button" class="btn-delete" onclick="this.parentElement.remove(); actualizarContador();">✕</button>
      `;
      contenedor.appendChild(div);
      actualizarContador();
    }

    function agregarAyuda() {
      const contenedor = document.getElementById('contenedorAyuda');
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      div.innerHTML = `
        <textarea class="inputAyudaItem" rows="2" placeholder="Otro indicador de apoyo..."></textarea>
        <button type="button" class="btn-delete" onclick="this.parentElement.remove(); actualizarContador();">✕</button>
      `;
      contenedor.appendChild(div);
      actualizarContador();
    }

    function agregarGustos() {
      const contenedor = document.getElementById('contenedorGustos');
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      div.innerHTML = `
        <textarea class="inputGustosItem" rows="2" placeholder="Otro gusto..."></textarea>
        <button type="button" class="btn-delete" onclick="this.parentElement.remove(); actualizarContador();">✕</button>
      `;
      contenedor.appendChild(div);
      actualizarContador();
    }

    function generarCarnetVisual() {
      const nombre = document.getElementById('inputNombre').value.trim();
      const diag = document.getElementById('inputDiagnostico').value.trim();
      const sangre = document.getElementById('inputSangre').value.trim();
      const alergias = document.getElementById('inputAlergias').value.trim();
      const comunicacion = document.getElementById('inputComunicacion').value.trim();
      const sueno = document.getElementById('inputSueno').value.trim();
      const fotoInput = document.getElementById('inputFoto');

      if(!nombre || fotoInput.files.length === 0) {
        alert('Por favor escribe el nombre del paciente y adjunta su fotografía.');
        return;
      }

      // Rellenar cabecera corporativa
      document.getElementById('viewNombre').innerText = "Hola, soy " + nombre;
      document.getElementById('viewSub').innerText = diag || "Perfil de emergencia e identificación médica.";

      const areaCards = document.getElementById('contenedorCardsSalida');
      areaCards.innerHTML = '';

      // 1. Alerta Médica y Seguridad
      areaCards.innerHTML += `
        <section class="info-card">
          <h2 class="card-heading">Alerta Médica y Seguridad</h2>
          <p class="card-copy"><b>Tipo de sangre:</b> ${sangre || "No especificado"}</p>
          <p class="card-copy"><b>Alergias:</b> ${alergias || "Ninguna registrada"}</p>
          <p class="card-copy"><b>Comunicación:</b> ${comunicacion || "No especificado"}</p>
        </section>
      `;

      // 2. Qué me incomoda o se me dificulta (Dinámico)
      let incomodasHTML = '';
      document.querySelectorAll('.inputIncomodaItem').forEach(el => {
        if(el.value.trim()) incomodasHTML += `<p class="card-copy">• ${el.value.trim()}</p>`;
      });
      if(incomodasHTML) {
        areaCards.innerHTML += `<section class="info-card"><h2 class="card-heading">Qué me incomoda o se me dificulta</h2>${incomodasHTML}</section>`;
      }

      // 3. Cómo puedes ayudarme (Dinámico)
      let ayudaHTML = '';
      document.querySelectorAll('.inputAyudaItem').forEach(el => {
        if(el.value.trim()) ayudaHTML += `<p class="card-copy">• ${el.value.trim()}</p>`;
      });
      if(ayudaHTML) {
        areaCards.innerHTML += `<section class="info-card"><h2 class="card-heading">Cómo puedes ayudarme</h2>${ayudaHTML}</section>`;
      }

      // 4. Gustos (Dinámico)
      let gustosHTML = '';
      document.querySelectorAll('.inputGustosItem').forEach(el => {
        if(el.value.trim()) gustosHTML += `<p class="card-copy">• ${el.value.trim()}</p>`;
      });
      if(gustosHTML) {
        areaCards.innerHTML += `<section class="info-card"><h2 class="card-heading">Gustos</h2>${gustosHTML}</section>`;
      }

      // 5. Sueño
      if(sueno) {
        areaCards.innerHTML += `
          <section class="info-card">
            <h2 class="card-heading">Sueño</h2>
            <p class="card-copy">${sueno.replace(/\n/g, '<br>')}</p>
          </section>
        `;
      }

      // 6. Botones de llamada operativa (tel:)
      document.querySelectorAll('.contactoTel').forEach(el => {
        if(el.value.trim()) {
          const telClean = el.value.trim().replace(/[^0-9+]/g, '');
          areaCards.innerHTML += `<a class="call-link" href="tel:${telClean}">Llamar a Emergencias: ${el.value.trim()}</a>`;
        }
      });

      // 7. Código QR corporativo
      areaCards.innerHTML += `
        <section class="qr-section">
          <h2 class="card-heading">Código QR del Carnet</h2>
          <p style="margin: 0 0 10px; font-size: 0.95rem;">Escanea este código para ver el perfil:</p>
          <div class="qr-box" id="qrcode"></div>
          <p id="linkTexto" style="word-break: break-all; font-weight: bold; color: var(--red); font-size: 0.9rem; margin-top: 10px;"></p>
        </section>
      `;

      // Cargar la foto de perfil seleccionada
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('viewFoto').src = e.target.result;
      }
      reader.readAsDataURL(fotoInput.files[0]);

      // Alternar vistas de forma limpia y local
      document.getElementById('panelFormulario').style.display = 'none';
      document.getElementById('tarjetaFinal').style.display = 'block';

      // Renderizar el QR limpio
      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = '';
      const urlBase = window.location.href.split('?')[0];
      const urlFinal = urlBase + "?p=" + encodeURIComponent(nombre);
      document.getElementById('linkTexto').innerText = urlFinal;

      new QRCode(qrContainer, {
        text: urlFinal,
        width: 140,
        height: 140,
        colorDark: "#183453",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
