<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Fichas Médicas – IPS</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --navy: #183453; 
      --red: #A82732; 
      --paper: #F3F5F4; 
      --yellow: #F7CF52; 
      --border: #B8C4C2;
    }
    * { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--navy); margin: 0; padding: 16px; }
    .container { max-width: 650px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: var(--navy); margin-bottom: 25px; font-weight: 800; }
    h3 { color: var(--navy); border-bottom: 2px solid var(--yellow); padding-bottom: 6px; margin-top: 25px; font-size: 1.1rem; }
    label { display: block; margin-top: 14px; font-weight: 700; font-size: 14px; color: var(--navy); }
    input, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid var(--border); border-radius: 10px; font: inherit; background: #fff; }
    input:focus, textarea:focus { outline: none; border-color: var(--navy); }
    .dynamic-row { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; }
    .btn-delete { background: #fff; color: var(--red); border: 1px solid var(--red); width: 44px; height: 44px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .btn-add { background: #fff; color: var(--navy); border: 2px solid var(--navy); width: 100%; padding: 10px; margin-top: 8px; font-weight: 700; border-radius: 10px; cursor: pointer; font-size: 13px; }
    .btn-action { background: var(--navy); color: #fff; border: none; width: 100%; padding: 15px; margin-top: 20px; font-weight: 800; border-radius: 14px; cursor: pointer; font-size: 16px; }
    
    /* Vista de la Tarjeta (Oculta por defecto, se muestra al generar) */
    #vistaTarjeta { display: none; }
    .tarjeta-final { background: var(--paper); border-radius: 20px; overflow: hidden; border: 1px solid #E3E8E7; }
    .profile-header { background: var(--yellow); padding: 35px 20px; text-align: center; }
    .portrait { width: 116px; height: 116px; margin: 0 auto 20px; border: 5px solid #fff; border-radius: 50%; object-fit: cover; display: block; }
    .profile-title { margin: 0; font-size: 2.2rem; font-weight: 800; color: var(--navy); }
    .profile-subtitle { margin: 15px auto 0; font-size: 1.1rem; font-weight: 700; color: var(--red); }
    .content-area { padding: 24px 16px; }
    .info-card { background: #fff; border: 1px solid #E3E8E7; border-radius: 20px; padding: 22px; margin-bottom: 14px; }
    .call-link { display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: center; border-radius: 14px; padding: 12px; background: var(--red); color: #fff; font-weight: 800; text-decoration: none; margin-top: 12px; }
  </style>
</head>
<body>

  <!-- 1. PANEL FORMULARIO -->
  <div class="container" id="panelFormulario">
    <h2>Generador de Fichas Médicas – IPS</h2>
    
    <h3>DATOS GENERALES</h3>
    <label>Nombre:</label>
    <input type="text" id="inputNombre" placeholder="Ej. Elena Contreras Rivera">

    <label>Diagnóstico / Presentación:</label>
    <textarea id="inputDiagnostico" rows="2" placeholder="Ej. Tengo diagnóstico de autismo..."></textarea>

    <label>Número(s) de contacto:</label>
    <div id="contenedorContactos">
      <div class="dynamic-row">
        <input type="tel" class="contactoTel" placeholder="Ej. 3114828893">
      </div>
    </div>
    <button type="button" class="btn-add" onclick="agregarCampo('contenedorContactos', 'tel', 'Número adicional')">+ Agregar contacto</button>

    <h3>LO QUE ME INCOMODA</h3>
    <div id="contenedorIncomoda">
      <div class="dynamic-row">
        <textarea class="inputIncomodaItem" rows="2" placeholder="Ej. Ruidos fuertes..."></textarea>
      </div>
    </div>
    <button type="button" class="btn-add" onclick="agregarCampo('contenedorIncomoda', 'textarea', 'Otra incomodidad...')">+ Agregar incomodidad</button>

    <label style="margin-top:20px;">Fotografía del Paciente:</label>
    <input type="file" id="inputFoto" accept="image/*">

    <button type="button" class="btn-action" onclick="generarCarnet()">Ver Carnet en Pantalla</button>
  </div>

  <!-- 2. VISTA FINAL DEL CARNET -->
  <div class="container" id="vistaTarjeta">
    <div class="tarjeta-final">
      <div class="profile-header">
        <img id="imgSalida" class="portrait" alt="Foto">
        <h1 class="profile-title" id="lblNombre"></h1>
        <p class="profile-subtitle" id="lblDiag"></p>
      </div>
      <div class="content-area" id="areaContenidoCards">
        <!-- Aquí se inyectan los datos limpios -->
      </div>
      <div style="padding: 20px; text-align: center;">
        <button type="button" class="btn-action" style="background:#6c757d; margin-top:0;" onclick="volverFormulario()">← Volver a Editar</button>
      </div>
    </div>
  </div>

  <script>
    // Función genérica ultra simple para agregar campos sin código complejo
    function agregarCampo(idContenedor, tipo, placeholder) {
      const contenedor = document.getElementById(idContenedor);
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      if(tipo === 'tel') {
        div.innerHTML = `<input type="tel" class="contactoTel" placeholder="${placeholder}"><button type="button" class="btn-delete" onclick="this.parentElement.remove()">✕</button>`;
      } else {
        div.innerHTML = `<textarea class="inputIncomodaItem" rows="2" placeholder="${placeholder}"></textarea><button type="button" class="btn-delete" onclick="this.parentElement.remove()">✕</button>`;
      }
      contenedor.appendChild(div);
    }

    // Generar la tarjeta directamente en la misma página ocultando el formulario (Cero errores de Blob)
    function generarCarnet() {
      const nombre = document.getElementById('inputNombre').value.trim();
      const diag = document.getElementById('inputDiagnostico').value.trim();
      const fotoInput = document.getElementById('inputFoto');

      if(!nombre) {
        alert('Por favor escribe al menos el nombre.');
        return;
      }

      // Asignar datos básicos
      document.getElementById('lblNombre').innerText = "Hola, soy " + nombre;
      document.getElementById('lblDiag').innerText = diag || "Perfil de emergencia médica.";

      const areaCards = document.getElementById('areaContenidoCards');
      areaCards.innerHTML = ''; // Limpiar anterior

      // Recopilar contactos
      document.querySelectorAll('.contactoTel').forEach(input => {
        if(input.value.trim()) {
          areaCards.innerHTML += `<a class="call-link" href="tel:${input.value.trim()}">Llamar a Emergencias: ${input.value.trim()}</a>`;
        }
      });

      // Recopilar incomodidades
      let incomodasHTML = '';
      document.querySelectorAll('.inputIncomodaItem').forEach(textarea => {
        if(textarea.value.trim()) {
          incomodasHTML += `<p>• ${textarea.value.trim()}</p>`;
        }
      });

      if(incomodasHTML) {
        areaCards.innerHTML += `<div class="info-card"><h3>Qué me incomoda</h3>${incomodasHTML}</div>`;
      }

      // Manejar foto
      if(fotoInput.files && fotoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('imgSalida').src = e.target.result;
        }
        reader.readAsDataURL(fotoInput.files[0]);
      }

      // Cambiar de vista de forma limpia
      document.getElementById('panelFormulario').style.display = 'none';
      document.getElementById('vistaTarjeta').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function volverFormulario() {
      document.getElementById('vistaTarjeta').style.display = 'none';
      document.getElementById('panelFormulario').style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
